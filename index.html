<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Реєстрація на подію</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

</head>
<body>
  <main class="container py-4">
    <h1>Майстер-клас із вайбкодингу</h1>
    <p>Вчимося збирати сторінку разом із AI і розуміти, що робить кожен рядок.</p>
    <p>Дата: 20 листопада 2026, 18:00</p>
    <p>Місце: Київ, вул. Хрещатик, 1</p>
    <form id="registration-form" class="mt-4" novalidate>
      <div class="mb-3">
        <label class="form-label" for="name">Ім'я</label>
        <input class="form-control" type="text" id="name" name="name">
      </div>
    
      <div class="mb-3">
        <label class="form-label" for="email">Електронна пошта</label>
        <input class="form-control" type="email" id="email" name="email">
      </div>
    
      <div class="mb-3">
        <label class="form-label" for="participants">Кількість учасників</label>
        <input class="form-control" type="number" id="participants" name="participants" min="1">
      </div>
    
      <button class="btn btn-primary" type="submit">Зареєструватися</button>
      <p id="form-message"></p>
    </form>
    <h2 class="mt-5">Вартість квитків</h2>
    <label class="form-label" for="category">Категорія квитка</label>
<select class="form-select" id="category">
  <option value="400">Standard — 400 грн</option>
  <option value="800">VIP — 800 грн</option>
</select>
    <label class="form-label" for="tickets">Кількість квитків</label>
<input class="form-control" type="number" id="tickets" min="1">
<label class="form-label" for="promo">Промокод</label>
<input class="form-control" type="text" id="promo">
<button class="btn btn-primary mt-3" type="button" id="calculate">Розрахувати</button>
<p id="price-message" class="mt-3"></p>
    </main>
    <script src="script.js"></script>
</body>
</html>
